<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendily — Attendance & Schedule Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
</head>

<body>

  <div class="auth-shell" id="authShell">
    <div class="auth-card" id="authCardMount"></div>
  </div>

  <div class="wrap hidden" id="appShell">
    <div class="topbar" id="topbar">
      <div class="brand">
        <div class="brand-mark-wrap">
          <svg width="20" height="20" viewBox="0 0 30 30">
            <circle cx="15" cy="15" r="11" fill="none" stroke="var(--line)" stroke-width="4.5" />
            <circle cx="15" cy="15" r="11" fill="none" stroke="var(--primary)" stroke-width="4.5" stroke-linecap="round"
              stroke-dasharray="50 69.1" transform="rotate(-90 15 15)" />
          </svg>
        </div>
        <div class="brand-word top">Attendily</div>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="scheduleToggleBtn" onclick="toggleSchedule()">Upload Schedule</button>
        <button class="topbar-btn primary" id="addToggleBtn" onclick="toggleAddForm('global')">+ Add subject</button>
      </div>
    </div>

    <div id="confirmOverlayMount"></div>
    <div id="scheduleMount"></div>
    <div id="editModalMount"></div>
    <div id="deleteModalMount"></div>

    <div class="userbar">
      <div class="user-pill">
        <span class="avatar-dot"></span>
        <span class="email" id="userEmailLabel"></span>
      </div>
      <div class="userbar-right">
        <button class="ghost-btn" onclick="AUTH.togglePwPanel()">Change password</button>
        <button class="ghost-btn danger" onclick="AUTH.signOut()">Sign out</button>
      </div>
    </div>

    <div id="pwPanelMount"></div>
    <div id="statusMount"></div>

    <!-- Overall Card -->
    <div class="overall" id="overallCard"></div>

    <!-- Days Navigation Bar -->
    <div class="days-nav-section">
      <div class="days-nav" id="daysNavMount"></div>
    </div>

    <!-- Active Day Context Bar -->
    <div id="dayActionBarMount"></div>

    <div id="addFormMount"></div>
    <div id="mainMount"></div>
  </div>

  <script src="app.js"></script>
</body>

</html>
