<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0f141b;
      --panel: #161d26;
      --panel-2: #1b232e;
      --line: #262f3b;
      --line-soft: #1e2632;
      --text: #eceef2;
      --text-dim: #8993a4;
      --text-faint: #4f5867;
      --safe: #6fa88a;
      --warn: #d8a94e;
      --danger: #c4593f;
      --primary: #6fa0c4;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: 'Inter', sans-serif;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh;
      overflow-x: hidden;
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    button {
      font-family: inherit;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 18px 60px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      flex-shrink: 0;
    }

    .brand-word {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .brand-tagline {
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeSlideUp .5s cubic-bezier(.2, .8, .2, 1) both;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }

    .auth-title {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 500;
      margin: 14px 0 0;
    }

    .auth-sub {
      font-size: 12.5px;
      color: var(--text-dim);
      margin: 0 0 4px;
      line-height: 1.45;
    }

    .field-wrap {
      position: relative;
    }

    .auth-input {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      font-size: 13.5px;
      padding: 12px 13px;
      width: 100%;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .auth-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(111, 160, 196, .15);
    }

    .field-wrap .auth-input {
      padding-right: 42px;
    }

    .eye-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: none;
      background: none;
      color: var(--text-faint);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color .15s ease, background .15s ease;
    }

    .eye-btn:hover {
      color: var(--text-dim);
      background: rgba(255, 255, 255, .04);
    }

    .auth-submit {
      margin-top: 4px;
      padding: 12px 0;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #0f141b;
      font-size: 13.5px;
      font-weight: 700;
      transition: transform .12s ease, filter .15s ease, box-shadow .15s ease;
      box-shadow: 0 6px 20px rgba(111, 160, 196, .18);
    }

    .auth-submit:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 8px 24px rgba(111, 160, 196, .28);
    }

    .auth-submit:active:not(:disabled) {
      transform: scale(.97);
    }

    .auth-submit:disabled {
      opacity: .5;
      cursor: default;
    }

    .auth-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 0;
      border-radius: 9px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }

    .auth-google-btn svg {
      flex-shrink: 0;
      display: block;
    }

    .auth-google-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, .06);
      border-color: rgba(255, 255, 255, .2);
    }

    .auth-google-btn:active:not(:disabled) {
      transform: scale(.98);
    }

    .auth-google-btn:disabled {
      opacity: .5;
      cursor: default;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-faint);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 2px 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--line);
    }

    .auth-divider span {
      padding: 0 10px;
    }

    .auth-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      cursor: pointer;
      padding: 2px;
      transition: opacity .15s ease;
    }

    .link-btn:hover {
      opacity: .75;
      text-decoration: underline;
    }

    .link-btn.muted {
      color: var(--text-dim);
    }

    .auth-msg {
      font-size: 12px;
      border-radius: 9px;
      padding: 10px 11px;
      line-height: 1.4;
      animation: popIn .25s ease both;
    }

    .auth-msg.error {
      color: var(--danger);
      background: rgba(196, 89, 63, .1);
      border: 1px solid rgba(196, 89, 63, .3);
    }

    .auth-msg.info {
      color: var(--safe);
      background: rgba(111, 168, 138, .1);
      border: 1px solid rgba(111, 168, 138, .3);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin: 0 -18px 20px;
      padding: 14px 18px;
      gap: 12px;
      transition: background .25s ease, backdrop-filter .25s ease, border-color .25s ease;
      border-bottom: 1px solid transparent;
    }

    .topbar.scrolled {
      background: rgba(15, 20, 27, .78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom-color: var(--line);
    }

    .brand-word.top {
      font-size: 22px;
    }

    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .userbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .email {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: var(--text-faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    .ghost-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 11.5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all .15s ease;
    }

    .ghost-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .ghost-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .addbtn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 9px;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
    }

    .addbtn:hover {
      background: rgba(111, 160, 196, .14);
      box-shadow: 0 4px 16px rgba(111, 160, 196, .18);
    }

    .addbtn:active {
      transform: scale(.96);
    }

    .addbtn.active {
      background: rgba(111, 160, 196, .14);
    }

    .status-banner {
      font-size: 11px;
      color: var(--warn);
      background: rgba(216, 169, 78, .1);
      border: 1px solid rgba(216, 169, 78, .3);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 16px;
      animation: popIn .25s ease both;
    }

    .overall {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      animation: fadeSlideUp .45s cubic-bezier(.2, .8, .2, 1) both;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .overall:hover {
      border-color: var(--line-soft);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .25);
    }

    .overall-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .overall-label {
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .overall-main {
      font-family: 'Fraunces', serif;
      font-size: 15px;
    }

    .overall-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 44px 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      animation: fadeSlideUp .4s ease both;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: transform .18s cubic-bezier(.2, .8, .2, 1), box-shadow .18s ease, border-color .18s ease;
      will-change: transform;
    }

    @media (hover:hover) and (pointer:fine) {
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, .35);
        border-color: var(--line-soft);
      }
    }

    .card.reveal {
      animation: fadeSlideUp .4s cubic-bezier(.2, .8, .2, 1) both;
    }

    .card .remove {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      line-height: 0;
      transition: color .15s ease, background .15s ease, transform .15s ease;
    }

    .card .remove:hover {
      color: var(--danger);
      background: rgba(196, 89, 63, .1);
      transform: rotate(90deg);
    }

    .card-head {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .card-name {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .tag {
      display: inline-block;
      margin-top: 5px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 20px;
      padding: 2px 8px;
    }

    .tag.theory {
      color: var(--text-dim);
      border: 1px solid var(--line);
    }

    .tag.lab {
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .steppers {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stepper .label {
      font-size: 12px;
      color: var(--text-dim);
      width: 58px;
      flex-shrink: 0;
    }

    .stepper .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stepbtn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      touch-action: manipulation;
      transition: border-color .15s ease, color .15s ease, transform .1s ease, background .15s ease;
    }

    @media (hover:hover) and (pointer:fine) {
      .stepbtn:hover {
        border-color: var(--primary);
        color: var(--text);
        background: rgba(111, 160, 196, .1);
      }
    }

    .stepbtn:active {
      transform: scale(.88);
    }

    .stepval {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      width: 26px;
      text-align: center;
      transition: color .2s ease;
    }

    .bump {
      animation: popIn .2s ease both;
    }

    .minrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }

    .minrow .lbl {
      font-size: 12px;
      color: var(--text-dim);
    }

    .mininput-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .mininput {
      width: 44px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      text-align: right;
      padding: 4px 5px;
      transition: border-color .15s ease;
    }

    .mininput:focus {
      border-color: var(--primary);
    }

    .pct-sign {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
    }

    .message {
      font-size: 12.5px;
      font-weight: 500;
      background: var(--panel-2);
      border-radius: 9px;
      padding: 9px 10px;
      line-height: 1.35;
      transition: background .2s ease;
    }

    .ring-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .ring-num {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .ring-num .n {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: var(--text);
      display: block;
      line-height: 1;
    }

    .ring-num .l {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--text-faint);
      display: block;
      margin-top: 2px;
    }

    .panel-form {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      max-width: 340px;
      animation: fadeSlideUp .3s cubic-bezier(.2, .8, .2, 1) both;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .3);
    }

    .panel-form-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-form-head span {
      font-family: 'Fraunces', serif;
      font-size: 15px;
    }

    .panel-form-head button {
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 4px;
      transition: transform .15s ease, color .15s ease;
    }

    .panel-form-head button:hover {
      color: var(--text);
      transform: rotate(90deg);
    }

    .panel-form input[type=text] {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      font-size: 13px;
      padding: 11px;
      width: 100%;
      transition: border-color .15s ease;
    }

    .panel-form input[type=text]:focus {
      border-color: var(--primary);
    }

    .type-row {
      display: flex;
      gap: 6px;
    }

    .type-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: .03em;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text-dim);
      transition: all .15s ease;
    }

    .type-btn.active {
      border-color: var(--primary);
      background: rgba(111, 160, 196, .12);
      color: var(--primary);
    }

    .submit-btn {
      margin-top: 2px;
      padding: 12px 0;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: #0f141b;
      font-size: 13px;
      font-weight: 700;
      transition: transform .12s ease, filter .15s ease;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
    }

    .submit-btn:active {
      transform: scale(.97);
    }

    .hidden {
      display: none !important;
    }

    .toggle-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-text .t {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .toggle-text .d {
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.4;
      max-width: 260px;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 24px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .switch-track::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 2px;
      background: var(--text-dim);
      border-radius: 50%;
      transition: transform .2s cubic-bezier(.2, .8, .2, 1), background .2s ease;
    }

    .switch input:checked+.switch-track {
      background: rgba(111, 160, 196, .25);
      border-color: var(--primary);
    }

    .switch input:checked+.switch-track::before {
      transform: translateX(18px);
      background: var(--primary);
    }

    .switch input:disabled+.switch-track {
      opacity: .5;
      cursor: default;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(15, 20, 27, .25);
      border-top-color: #0f141b;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    @media (max-width:480px) {
      .wrap {
        padding: 16px 12px 48px;
      }

      .topbar {
        margin: 0 -12px 18px;
        padding: 12px;
      }

      .brand-word.top {
        font-size: 19px;
      }

      .addbtn {
        padding: 9px 12px;
        font-size: 12.5px;
      }

      .overall {
        padding: 16px;
        gap: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .panel-form {
        max-width: 100%;
      }

      .card-name {
        max-width: 120px;
      }

      .email {
        max-width: 120px;
      }

      .auth-card {
        padding: 24px 20px;
      }
    }

    @media (min-width:481px) and (max-width:700px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
</head>

<body>

  <div class="auth-shell" id="authShell">
    <div class="auth-card" id="authCardMount"></div>
  </div>

  <div class="wrap hidden" id="appShell">
    <div class="topbar" id="topbar">
      <div class="brand">
        <svg class="brand-mark" width="30" height="30" viewBox="0 0 30 30">
          <circle cx="15" cy="15" r="12" fill="none" stroke="var(--line)" stroke-width="3.2" />
          <circle cx="15" cy="15" r="12" fill="none" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round"
            stroke-dasharray="56 75.4" transform="rotate(-90 15 15)" />
        </svg>
        <div class="brand-word top">Attendily</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="addbtn" id="groupToggleBtn" onclick="toggleGroupByDay()">By day</button>
        <button class="addbtn" id="scheduleToggleBtn" onclick="toggleSchedule()">Schedule</button>
        <button class="addbtn" id="addToggleBtn" onclick="toggleAddForm()">+ Add subject</button>
      </div>
    </div>

    <div id="confirmOverlayMount"></div>
    <div id="scheduleMount"></div>

    <div class="userbar">
      <span class="email" id="userEmailLabel"></span>
      <div class="userbar-right">
        <button class="ghost-btn" onclick="AUTH.togglePwPanel()">Change password</button>
        <button class="ghost-btn danger" onclick="AUTH.signOut()">Sign out</button>
      </div>
    </div>

    <div id="pwPanelMount"></div>
    <div id="statusMount"></div>
    <div class="overall" id="overallCard"></div>
    <div id="addFormMount"></div>
    <div id="mainMount"></div>
  </div>

  <script>
    (function () {
      var SUPABASE_URL = window.SUPABASE_URL || '';
      var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || '';

      var supabase = null;
      var configured = !!SUPABASE_URL && !!SUPABASE_ANON_KEY;
      if (configured && window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      var subjects = [];
      var loaded = false;
      var showAdd = false;
      var currentUser = null;
      var firstRender = true;

      var EYE_OPEN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      var EYE_CLOSED = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

      var authMode = 'signin';
      var pwPanelOpen = false;

      function fieldWithEye(id, placeholder, autocomplete) {
        return (
          '<div class="field-wrap">' +
          '<input class="auth-input" type="password" id="' + id + '" placeholder="' + placeholder + '" autocomplete="' + autocomplete + '"/>' +
          '<button type="button" class="eye-btn" id="' + id + 'Eye" onclick="AUTH.toggleVisibility(\'' + id + '\')">' + EYE_OPEN + '</button>' +
          '</div>'
        );
      }

      function renderAuth() {
        var mount = document.getElementById('authCardMount');
        var brandBlock =
          '<div class="brand">' +
          '<svg class="brand-mark" width="34" height="34" viewBox="0 0 30 30">' +
          '<circle cx="15" cy="15" r="12" fill="none" stroke="var(--line)" stroke-width="3.2"/>' +
          '<circle cx="15" cy="15" r="12" fill="none" stroke="var(--primary)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="56 75.4" transform="rotate(-90 15 15)"/>' +
          '</svg>' +
          '<div><div class="brand-word" style="font-size:22px;">Attendily</div><div class="brand-tagline">Attendance, without the guesswork.</div></div>' +
          '</div>';

        if (authMode === 'forgot') {
          mount.innerHTML =
            brandBlock +
            '<div class="auth-title">Reset your password</div>' +
            '<p class="auth-sub">Enter your email and we\'ll send a reset link.</p>' +
            '<div id="authMsgMount"></div>' +
            '<input class="auth-input" type="email" id="authEmail" placeholder="Email" autocomplete="email"/>' +
            '<button class="auth-submit" id="authSubmitBtn" onclick="AUTH.sendReset()">Send reset link</button>' +
            '<div class="auth-links"><button class="link-btn muted" onclick="AUTH.toggleMode(\'signin\')">&larr; Back to sign in</button></div>';
        } else if (authMode === 'reset') {
          mount.innerHTML =
            brandBlock +
            '<div class="auth-title">Set a new password</div>' +
            '<p class="auth-sub">Choose a new password for your account.</p>' +
            '<div id="authMsgMount"></div>' +
            fieldWithEye('authNewPassword', 'New password', 'new-password') +
            fieldWithEye('authNewPassword2', 'Confirm new password', 'new-password') +
            '<button class="auth-submit" id="authSubmitBtn" onclick="AUTH.updatePassword()">Update password</button>';
        } else {
          var isSignup = authMode === 'signup';
          mount.innerHTML =
            brandBlock +
            '<div class="auth-title">' + (isSignup ? 'Create account' : 'Sign in') + '</div>' +
            '<p class="auth-sub">' + (isSignup ? 'One account works across your phone, laptop, and any browser.' : 'Use your email to track attendance across every device.') + '</p>' +
            '<div id="authMsgMount"></div>' +
            '<button class="auth-google-btn" id="googleSignInBtn" onclick="AUTH.signInWithGoogle()">' +
            '<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>' +
            '<span>' + (isSignup ? 'Sign up with Google' : 'Sign in with Google') + '</span>' +
            '</button>' +
            '<div class="auth-divider"><span>or</span></div>' +
            '<input class="auth-input" type="email" id="authEmail" placeholder="Email" autocomplete="email"/>' +
            fieldWithEye('authPassword', 'Password', isSignup ? 'new-password' : 'current-password') +
            '<button class="auth-submit" id="authSubmitBtn" onclick="AUTH.submit()">' + (isSignup ? 'Sign up' : 'Sign in') + '</button>' +
            '<div class="auth-links">' +
            '<button class="link-btn" onclick="AUTH.toggleMode(\'' + (isSignup ? 'signin' : 'signup') + '\')">' + (isSignup ? 'Already have an account? Sign in' : 'New here? Create an account') + '</button>' +
            (isSignup ? '' : '<button class="link-btn muted" onclick="AUTH.toggleMode(\'forgot\')">Forgot password?</button>') +
            '</div>';
        }

        var pwField = document.getElementById('authPassword');
        if (pwField) pwField.addEventListener('keydown', function (e) { if (e.key === 'Enter') AUTH.submit(); });
        var emailField = document.getElementById('authEmail');
        if (emailField && authMode === 'forgot') emailField.addEventListener('keydown', function (e) { if (e.key === 'Enter') AUTH.sendReset(); });
      }

      function showAuthMsg(msg, kind) {
        var mount = document.getElementById('authMsgMount');
        if (!mount) return;
        if (!msg) { mount.innerHTML = ''; return; }
        mount.innerHTML = '<div class="auth-msg ' + (kind || 'error') + '">' + msg + '</div>';
      }

      window.AUTH = {
        signInWithGoogle: async function () {
          if (!configured) { showAuthMsg("Attendily isn't configured yet — check back shortly."); return; }
          var btn = document.getElementById('googleSignInBtn');
          if (btn) btn.disabled = true;
          showAuthMsg(null);
          try {
            var res = await supabase.auth.signInWithOAuth({
              provider: 'google',
              options: {
                redirectTo: window.location.origin
              }
            });
            if (res.error) throw res.error;
          } catch (e) {
            showAuthMsg(e.message || 'Failed to sign in with Google.');
            if (btn) btn.disabled = false;
          }
        },

        toggleMode: function (mode) {
          authMode = mode;
          renderAuth();
        },

        toggleVisibility: function (id) {
          var input = document.getElementById(id);
          var btn = document.getElementById(id + 'Eye');
          if (!input || !btn) return;
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = EYE_CLOSED;
          } else {
            input.type = 'password';
            btn.innerHTML = EYE_OPEN;
          }
        },

        submit: async function () {
          if (!configured) { showAuthMsg("Attendily isn't configured yet — check back shortly."); return; }
          var email = document.getElementById('authEmail').value.trim();
          var password = document.getElementById('authPassword').value;
          if (!email || !password) { showAuthMsg('Enter both email and password.'); return; }

          var btn = document.getElementById('authSubmitBtn');
          var original = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>';
          showAuthMsg(null);

          try {
            if (authMode === 'signup') {
              var res = await supabase.auth.signUp({ email: email, password: password });
              if (res.error) throw res.error;
              if (res.data.session) {
                onSignedIn(res.data.session.user);
              } else {
                showAuthMsg('Check your inbox to confirm your email, then sign in.', 'info');
                btn.disabled = false;
                btn.innerHTML = original;
              }
            } else {
              var res2 = await supabase.auth.signInWithPassword({ email: email, password: password });
              if (res2.error) throw res2.error;
              onSignedIn(res2.data.user);
            }
          } catch (e) {
            showAuthMsg(e.message || 'Something went wrong.');
            btn.disabled = false;
            btn.innerHTML = original;
          }
        },

        sendReset: async function () {
          if (!configured) { showAuthMsg("Attendily isn't configured yet — check back shortly."); return; }
          var email = document.getElementById('authEmail').value.trim();
          if (!email) { showAuthMsg('Enter your email first.'); return; }
          var btn = document.getElementById('authSubmitBtn');
          var original = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>';
          try {
            var res = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
            if (res.error) throw res.error;
            showAuthMsg('Reset link sent. Check your inbox.', 'info');
          } catch (e) {
            showAuthMsg(e.message || 'Something went wrong.');
          }
          btn.disabled = false;
          btn.innerHTML = original;
        },

        updatePassword: async function () {
          var p1 = document.getElementById('authNewPassword').value;
          var p2 = document.getElementById('authNewPassword2').value;
          if (!p1 || p1.length < 6) { showAuthMsg('Password must be at least 6 characters.'); return; }
          if (p1 !== p2) { showAuthMsg("Passwords don't match."); return; }
          var btn = document.getElementById('authSubmitBtn');
          var original = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>';
          try {
            var res = await supabase.auth.updateUser({ password: p1 });
            if (res.error) throw res.error;
            onSignedIn(res.data.user);
          } catch (e) {
            showAuthMsg(e.message || 'Something went wrong.');
            btn.disabled = false;
            btn.innerHTML = original;
          }
        },

        togglePwPanel: function () {
          pwPanelOpen = !pwPanelOpen;
          renderPwPanel();
        },

        changePasswordInApp: async function () {
          var p1 = document.getElementById('appNewPassword').value;
          var p2 = document.getElementById('appNewPassword2').value;
          var mount = document.getElementById('appPwMsg');
          if (!p1 || p1.length < 6) { mount.innerHTML = '<div class="auth-msg error">Password must be at least 6 characters.</div>'; return; }
          if (p1 !== p2) { mount.innerHTML = "<div class=\"auth-msg error\">Passwords don't match.</div>"; return; }
          var btn = document.getElementById('appPwSubmit');
          var original = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>';
          try {
            var res = await supabase.auth.updateUser({ password: p1 });
            if (res.error) throw res.error;
            mount.innerHTML = '<div class="auth-msg info">Password updated.</div>';
            setTimeout(function () { pwPanelOpen = false; renderPwPanel(); }, 1200);
          } catch (e) {
            mount.innerHTML = '<div class="auth-msg error">' + (e.message || 'Something went wrong.') + '</div>';
            btn.disabled = false;
            btn.innerHTML = original;
          }
        },

        signOut: async function () {
          if (configured) {
            try { await supabase.auth.signOut(); } catch (e) { }
          }
          currentUser = null;
          subjects = [];
          showAdd = false;
          pwPanelOpen = false;
          firstRender = true;
          document.getElementById('appShell').classList.add('hidden');
          document.getElementById('authShell').classList.remove('hidden');
          authMode = 'signin';
          renderAuth();
        }
      };

      function renderPwPanel() {
        var mount = document.getElementById('pwPanelMount');
        if (!pwPanelOpen) { mount.innerHTML = ''; return; }
        mount.innerHTML =
          '<div class="panel-form">' +
          '<div class="panel-form-head"><span>Change password</span><button onclick="AUTH.togglePwPanel()">&#10005;</button></div>' +
          '<div id="appPwMsg"></div>' +
          fieldWithEyeApp('appNewPassword', 'New password') +
          fieldWithEyeApp('appNewPassword2', 'Confirm new password') +
          '<button class="submit-btn" id="appPwSubmit" onclick="AUTH.changePasswordInApp()">Update password</button>' +
          '</div>';
      }

      function fieldWithEyeApp(id, placeholder) {
        return (
          '<div class="field-wrap">' +
          '<input class="auth-input" type="password" id="' + id + '" placeholder="' + placeholder + '" autocomplete="new-password"/>' +
          '<button type="button" class="eye-btn" id="' + id + 'Eye" onclick="AUTH.toggleVisibility(\'' + id + '\')">' + EYE_OPEN + '</button>' +
          '</div>'
        );
      }

      function onSignedIn(user) {
        currentUser = user;
        firstRender = true;
        document.getElementById('authShell').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        document.getElementById('userEmailLabel').textContent = user.email;
        loadData();
        checkConfirmParam();
      }

      async function checkExistingSession() {
        if (!configured) {
          renderAuth();
          showAuthMsg("Attendily isn't configured yet — check back shortly.");
          return;
        }
        try {
          var res = await supabase.auth.getSession();
          if (res.data.session) {
            onSignedIn(res.data.session.user);
          } else {
            renderAuth();
          }
        } catch (e) {
          renderAuth();
        }
      }

      function showStatus(msg, isError) {
        var mount = document.getElementById('statusMount');
        if (!msg) { mount.innerHTML = ''; return; }
        mount.innerHTML = '<div class="status-banner" style="' +
          (isError ? 'color:var(--danger);background:rgba(196,89,63,.1);border-color:rgba(196,89,63,.3);' : '') +
          '">' + msg + '</div>';
      }

      function rowToLocal(r) {
        return { id: r.id, name: r.name, type: r.type, min: r.min_attendance, attended: r.attended, missed: r.missed };
      }

      async function loadData() {
        try {
          var res = await supabase.from('subjects').select('*').order('created_at', { ascending: true });
          if (res.error) throw res.error;
          subjects = res.data.map(rowToLocal);
          showStatus(null);
        } catch (e) {
          showStatus("Couldn't reach the server: " + e.message, true);
        }
        try {
          var schedRes = await supabase.from('class_schedule').select('*, subjects(name,type)').order('day_of_week').order('start_time');
          if (schedRes.error) throw schedRes.error;
          schedule = schedRes.data;
        } catch (e) {
          schedule = [];
        }
        loaded = true;
        render();
      }

      function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

      function calc(attended, missed, min) {
        var total = attended + missed;
        if (total === 0) return { pct: null, total: 0, canMiss: null, mustAttend: null, status: 'empty' };
        var pct = (attended / total) * 100;
        if (min >= 100) {
          if (missed > 0) return { pct: pct, total: total, canMiss: 0, mustAttend: Infinity, status: 'impossible' };
          return { pct: pct, total: total, canMiss: 0, mustAttend: 0, status: pct >= 100 ? 'safe' : 'impossible' };
        }
        if (pct >= min) {
          var canMiss = Math.floor((attended * 100 - min * total) / min);
          if (canMiss < 0) canMiss = 0;
          return { pct: pct, total: total, canMiss: canMiss, mustAttend: 0, status: canMiss === 0 ? 'warn' : 'safe' };
        } else {
          var mustAttend = Math.ceil((min * total - attended * 100) / (100 - min));
          return { pct: pct, total: total, canMiss: 0, mustAttend: mustAttend, status: 'danger' };
        }
      }

      function statusColor(status) {
        if (status === 'safe') return 'var(--safe)';
        if (status === 'warn') return 'var(--warn)';
        if (status === 'danger' || status === 'impossible') return 'var(--danger)';
        return 'var(--text-faint)';
      }

      function ringSVG(pct, min, size, stroke, big) {
        size = size || 76; stroke = stroke || 7;
        var r = (size - stroke) / 2;
        var c = 2 * Math.PI * r;
        var p = pct === null ? 0 : clamp(pct, 0, 100);
        var dash = (p / 100) * c;
        var ringColor = pct === null ? 'var(--line)' : (pct >= min ? 'var(--safe)' : (pct >= min - 10 ? 'var(--warn)' : 'var(--danger)'));
        var minFrac = clamp(min, 0, 100) / 100;
        var minAngle = minFrac * 360 - 90;
        var rad = minAngle * Math.PI / 180;
        var cx = size / 2, cy = size / 2;
        var tickInner = r - stroke / 2 - 1;
        var tickOuter = r + stroke / 2 + 3;
        var tx1 = cx + tickInner * Math.cos(rad), ty1 = cy + tickInner * Math.sin(rad);
        var tx2 = cx + tickOuter * Math.cos(rad), ty2 = cy + tickOuter * Math.sin(rad);

        var progressCircle = pct !== null ? (
          '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + ringColor + '" stroke-width="' + stroke + '" ' +
          'stroke-dasharray="' + dash + ' ' + (c - dash) + '" stroke-linecap="round" transform="rotate(-90 ' + cx + ' ' + cy + ')" ' +
          'style="transition:stroke-dasharray .4s cubic-bezier(.2,.8,.2,1), stroke .3s ease"/>'
        ) : '';

        return (
          '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="overflow:visible;flex-shrink:0;">' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="' + stroke + '"/>' +
          progressCircle +
          '<line x1="' + tx1 + '" y1="' + ty1 + '" x2="' + tx2 + '" y2="' + ty2 + '" stroke="var(--text-faint)" stroke-width="1.5"/>' +
          '</svg>'
        );
      }

      function ringWithLabel(pct, min, size, stroke, big) {
        var numSize = big ? 22 : 15;
        var lblSize = big ? 10 : 8;
        var numText = pct === null ? '—' : Math.round(pct);
        return (
          '<div class="ring-wrap">' +
          ringSVG(pct, min, size, stroke, big) +
          '<div class="ring-num">' +
          '<span class="n" style="font-size:' + numSize + 'px;">' + numText + '</span>' +
          (pct !== null ? '<span class="l" style="font-size:' + lblSize + 'px;">PCT</span>' : '') +
          '</div>' +
          '</div>'
        );
      }

      function render() {
        renderOverall();
        renderAddForm();
        renderMain();
        firstRender = false;
      }

      function renderOverall() {
        var withData = subjects.filter(function (s) { return (s.attended + s.missed) > 0; });
        var overallPct = withData.length
          ? withData.reduce(function (sum, s) { return sum + (s.attended / (s.attended + s.missed)) * 100; }, 0) / withData.length
          : null;
        var totalAttended = subjects.reduce(function (a, s) { return a + s.attended; }, 0);
        var totalClasses = subjects.reduce(function (a, s) { return a + s.attended + s.missed; }, 0);
        var avgMin = subjects.length ? subjects.reduce(function (a, s) { return a + s.min; }, 0) / subjects.length : 75;

        var mainText = overallPct === null
          ? 'No data yet'
          : overallPct.toFixed(1) + '% average across ' + withData.length + ' subject' + (withData.length !== 1 ? 's' : '');

        document.getElementById('overallCard').innerHTML =
          ringWithLabel(overallPct, avgMin, 92, 8, true) +
          '<div class="overall-text">' +
          '<span class="overall-label">Overall attendance</span>' +
          '<span class="overall-main">' + mainText + '</span>' +
          '<span class="overall-sub">' + totalAttended + ' / ' + totalClasses + ' classes logged</span>' +
          '</div>';
      }

      var addFormType = 'theory';
      var addFormSetTime = false;

      function renderAddForm() {
        var mount = document.getElementById('addFormMount');
        if (!showAdd) { mount.innerHTML = ''; document.getElementById('addToggleBtn').classList.remove('active'); return; }
        document.getElementById('addToggleBtn').classList.add('active');
        document.getElementById('addToggleBtn').textContent = '+ Add subject';

        var dayOptions = DAY_NAMES.map(function (d, i) { return '<option value="' + i + '">' + d + '</option>'; }).join('');

        mount.innerHTML =
          '<div class="panel-form">' +
          '<div class="panel-form-head"><span>New subject</span><button onclick="AT.closeAdd()">&#10005;</button></div>' +
          '<input type="text" id="newSubjectName" placeholder="Subject name" maxlength="40"/>' +
          '<div class="type-row">' +
          '<button type="button" class="type-btn ' + (addFormType === 'theory' ? 'active' : '') + '" onclick="AT.setType(\'theory\')">Theory</button>' +
          '<button type="button" class="type-btn ' + (addFormType === 'lab' ? 'active' : '') + '" onclick="AT.setType(\'lab\')">Lab</button>' +
          '</div>' +
          '<div class="minrow" style="border-top:none; padding-top:0;">' +
          '<span class="lbl">Min attendance required</span>' +
          '<div class="mininput-wrap"><input class="mininput" type="number" id="newSubjectMin" min="0" max="100" value="75"/><span class="pct-sign">%</span></div>' +
          '</div>' +
          '<label style="display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); cursor:pointer;">' +
          '<input type="checkbox" id="newSubjectSetTime" ' + (addFormSetTime ? 'checked' : '') + ' onchange="AT.toggleTimeFields(this.checked)"/> Set a class day and time' +
          '</label>' +
          '<div id="newSubjectTimeFields" class="' + (addFormSetTime ? '' : 'hidden') + '" style="display:flex; gap:6px;">' +
          '<select class="auth-input" id="newSubjectDay" style="flex:1;">' + dayOptions + '</select>' +
          '<input class="auth-input" type="time" id="newSubjectStart" style="flex:1;"/>' +
          '<input class="auth-input" type="time" id="newSubjectEnd" style="flex:1;"/>' +
          '</div>' +
          '<button class="submit-btn" onclick="AT.submitAdd()">Add subject</button>' +
          '</div>';

        var nameInput = document.getElementById('newSubjectName');
        nameInput.focus();
        nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') AT.submitAdd(); });
      }

      var groupByDay = false;

      function toggleGroupByDay() {
        groupByDay = !groupByDay;
        document.getElementById('groupToggleBtn').classList.toggle('active', groupByDay);
        renderMain();
      }
      window.toggleGroupByDay = toggleGroupByDay;

      function slotsForSubject(subjectId) {
        return schedule.filter(function (c) { return c.subject_id === subjectId; })
          .sort(function (a, b) { return a.day_of_week - b.day_of_week || a.start_time.localeCompare(b.start_time); });
      }

      function slotLabel(slot) {
        return DAY_NAMES[slot.day_of_week] + ' ' + slot.start_time.slice(0, 5) + '\u2013' + slot.end_time.slice(0, 5);
      }

      function renderMain() {
        var mount = document.getElementById('mainMount');
        if (subjects.length === 0) {
          mount.innerHTML = showAdd ? '' : '<div class="empty">No subjects yet. Add your first one to start tracking.</div>';
          return;
        }
        if (groupByDay) {
          renderMainGrouped(mount);
        } else {
          var html = '<div class="grid">';
          subjects.forEach(function (s, i) { html += cardHTML(s, i, null); });
          html += '</div>';
          mount.innerHTML = html;
        }
      }

      function renderMainGrouped(mount) {
        var order = [1, 2, 3, 4, 5, 6, 0];
        var html = '';
        var cardIndex = 0;
        var seenAny = false;

        order.forEach(function (day) {
          var daySlots = schedule.filter(function (c) { return c.day_of_week === day; })
            .sort(function (a, b) { return a.start_time.localeCompare(b.start_time); });
          if (daySlots.length === 0) return;
          seenAny = true;
          html += '<div style="margin:22px 0 10px; font-family:\'Fraunces\',serif; font-size:15px; color:var(--text-dim);">' + DAY_NAMES[day] + '</div>';
          html += '<div class="grid">';
          daySlots.forEach(function (slot) {
            var s = subjects.find(function (x) { return x.id === slot.subject_id; });
            if (!s) return;
            html += cardHTML(s, cardIndex++, slotLabel(slot));
          });
          html += '</div>';
        });

        var unscheduled = subjects.filter(function (s) { return slotsForSubject(s.id).length === 0; });
        if (unscheduled.length) {
          html += '<div style="margin:22px 0 10px; font-family:\'Fraunces\',serif; font-size:15px; color:var(--text-dim);">No schedule set</div>';
          html += '<div class="grid">';
          unscheduled.forEach(function (s) { html += cardHTML(s, cardIndex++, null); });
          html += '</div>';
        }

        if (!seenAny && !unscheduled.length) {
          html = '<div class="empty">Nothing scheduled yet.</div>';
        }

        mount.innerHTML = html;
      }

      function cardHTML(s, i, slotText) {
        var r = calc(s.attended, s.missed, s.min);
        var color = statusColor(r.status);
        var message;
        if (r.status === 'empty') message = 'No classes logged yet';
        else if (r.status === 'impossible') message = s.missed > 0 ? "100% is no longer reachable" : "Can't miss a single class";
        else if (r.status === 'danger') message = 'Attend next ' + r.mustAttend + ' in a row to reach ' + s.min + '%';
        else if (r.status === 'warn') message = "On the edge — can't miss any";
        else message = 'Can afford to miss ' + r.canMiss + ' more';

        var safeName = s.name.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var revealClass = firstRender ? ' reveal' : '';
        var revealStyle = firstRender ? ' style="animation-delay:' + (i * 45) + 'ms;"' : '';

        var slots = slotsForSubject(s.id);
        var whenHTML = '';
        if (slotText) {
          whenHTML = '<div style="font-family:\'IBM Plex Mono\',monospace; font-size:10.5px; color:var(--text-faint); margin-top:4px;">' + slotText + '</div>';
        } else if (slots.length) {
          whenHTML = '<div style="font-family:\'IBM Plex Mono\',monospace; font-size:10.5px; color:var(--text-faint); margin-top:4px;">' + slots.map(slotLabel).join(', ') + '</div>';
        }

        return (
          '<div class="card' + revealClass + '"' + revealStyle + '>' +
          '<button class="remove" onclick="AT.removeSubject(\'' + s.id + '\')" aria-label="remove subject">&#10005;</button>' +
          '<div class="card-head">' +
          ringWithLabel(r.pct, s.min, 76, 7, false) +
          '<div style="min-width:0;">' +
          '<div class="card-name">' + safeName + '</div>' +
          '<span class="tag ' + s.type + '">' + s.type + '</span>' +
          whenHTML +
          '</div>' +
          '</div>' +
          '<div class="steppers">' +
          stepperHTML(s.id, 'attended', 'Present', s.attended, 'var(--safe)') +
          stepperHTML(s.id, 'missed', 'Absent', s.missed, 'var(--danger)') +
          '</div>' +
          '<div class="minrow">' +
          '<span class="lbl">Min required</span>' +
          '<div class="mininput-wrap">' +
          '<input class="mininput" type="number" min="0" max="100" value="' + s.min + '" onchange="AT.setMin(\'' + s.id + '\', this.value)"/>' +
          '<span class="pct-sign">%</span>' +
          '</div>' +
          '</div>' +
          '<div class="message" style="color:' + color + ';">' + message + '</div>' +
          '</div>'
        );
      }

      function stepperHTML(id, field, label, value, tint) {
        return (
          '<div class="stepper">' +
          '<span class="label">' + label + '</span>' +
          '<div class="controls">' +
          '<button class="stepbtn" onclick="AT.step(\'' + id + '\',\'' + field + '\',-1)" aria-label="decrease ' + label + '">&#8722;</button>' +
          '<span class="stepval bump" style="color:' + tint + ';">' + value + '</span>' +
          '<button class="stepbtn" onclick="AT.step(\'' + id + '\',\'' + field + '\',1)" aria-label="increase ' + label + '">&#43;</button>' +
          '</div>' +
          '</div>'
        );
      }

      function toggleAddForm() { showAdd = !showAdd; render(); }

      window.AT = {
        setType: function (t) { addFormType = t; renderAddForm(); },
        closeAdd: function () { showAdd = false; render(); },

        toggleTimeFields: function (checked) {
          addFormSetTime = checked;
          document.getElementById('newSubjectTimeFields').classList.toggle('hidden', !checked);
        },

        submitAdd: async function () {
          var nameInput = document.getElementById('newSubjectName');
          var minInput = document.getElementById('newSubjectMin');
          var name = nameInput.value.trim();
          if (!name) { nameInput.focus(); return; }
          var min = clamp(parseInt(minInput.value || '0', 10), 0, 100);
          var setTime = document.getElementById('newSubjectSetTime').checked;
          var day = setTime ? parseInt(document.getElementById('newSubjectDay').value, 10) : null;
          var start = setTime ? document.getElementById('newSubjectStart').value : null;
          var end = setTime ? document.getElementById('newSubjectEnd').value : null;
          try {
            var res = await supabase.from('subjects')
              .insert([{ name: name, type: addFormType, min_attendance: min, attended: 0, missed: 0 }])
              .select();
            if (res.error) throw res.error;
            var newSubject = res.data[0];
            subjects.push(rowToLocal(newSubject));
            if (setTime && start && end) {
              var schedRes = await supabase.from('class_schedule')
                .insert([{ subject_id: newSubject.id, day_of_week: day, start_time: start, end_time: end }]);
              if (schedRes.error) throw schedRes.error;
            }
            showStatus(null);
          } catch (e) {
            showStatus("Couldn't add subject: " + e.message, true);
          }
          addFormType = 'theory';
          addFormSetTime = false;
          showAdd = false;
          await loadSchedule();
        },

        removeSubject: async function (id) {
          var prev = subjects;
          subjects = subjects.filter(function (s) { return s.id !== id; });
          render();
          try {
            var res = await supabase.from('subjects').delete().eq('id', id);
            if (res.error) throw res.error;
            showStatus(null);
          } catch (e) {
            subjects = prev;
            showStatus("Couldn't delete: " + e.message, true);
            render();
          }
        },

        step: async function (id, field, delta) {
          var s = subjects.find(function (x) { return x.id === id; });
          if (!s) return;
          var prevVal = s[field];
          s[field] = Math.max(0, s[field] + delta);
          render();
          var patch = {};
          patch[field] = s[field];
          try {
            var res = await supabase.from('subjects').update(patch).eq('id', id);
            if (res.error) throw res.error;
            showStatus(null);
          } catch (e) {
            s[field] = prevVal;
            showStatus("Couldn't save change: " + e.message, true);
            render();
          }
        },

        setMin: async function (id, val) {
          var s = subjects.find(function (x) { return x.id === id; });
          if (!s) return;
          var prevMin = s.min;
          s.min = clamp(parseInt(val || '0', 10), 0, 100);
          render();
          try {
            var res = await supabase.from('subjects').update({ min_attendance: s.min }).eq('id', id);
            if (res.error) throw res.error;
            showStatus(null);
          } catch (e) {
            s.min = prevMin;
            showStatus("Couldn't save change: " + e.message, true);
            render();
          }
        }
      };

      var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var schedule = [];
      var showSchedule = false;
      var importDraft = null;
      var pushEnabled = false;

      function toggleSchedule() {
        showSchedule = !showSchedule;
        document.getElementById('scheduleToggleBtn').classList.toggle('active', showSchedule);
        if (showSchedule) { refreshPushState().then(loadSchedule); } else { document.getElementById('scheduleMount').innerHTML = ''; }
      }
      window.toggleSchedule = toggleSchedule;

      async function refreshPushState() {
        try {
          var res = await supabase.from('push_tokens').select('id').limit(1);
          if (res.error) throw res.error;
          pushEnabled = res.data.length > 0;
        } catch (e) {
          pushEnabled = false;
        }
      }

      async function loadSchedule() {
        try {
          var res = await supabase.from('class_schedule').select('*, subjects(name,type)').order('day_of_week').order('start_time');
          if (res.error) throw res.error;
          schedule = res.data;
        } catch (e) {
          showStatus("Couldn't load schedule: " + e.message, true);
          schedule = [];
        }
        renderSchedule();
        render();
      }

      function renderSchedule() {
        var mount = document.getElementById('scheduleMount');
        if (!showSchedule) { mount.innerHTML = ''; return; }

        var rows = schedule.map(function (c) {
          return (
            '<div class="stepper" style="border-top:1px solid var(--line-soft); padding-top:8px;">' +
            '<span class="label" style="width:auto; flex:1;">' + DAY_NAMES[c.day_of_week] + ' ' + c.start_time.slice(0, 5) + '\u2013' + c.end_time.slice(0, 5) + ' \u00b7 ' + (c.subjects ? c.subjects.name : '') + '</span>' +
            '<div class="controls">' +
            '<button class="ghost-btn" onclick="SCHEDULE.cancelNext(\'' + c.id + '\')">Cancel next</button>' +
            '<button class="remove" style="position:static;" onclick="SCHEDULE.removeClass(\'' + c.id + '\')">&#10005;</button>' +
            '</div>' +
            '</div>'
          );
        }).join('');

        var subjectOptions = subjects.map(function (s) { return '<option value="' + s.id + '">' + s.name + '</option>'; }).join('');
        var dayOptions = DAY_NAMES.map(function (d, i) { return '<option value="' + i + '">' + d + '</option>'; }).join('');

        mount.innerHTML =
          '<div class="panel-form" style="max-width:480px;">' +
          '<div class="panel-form-head"><span>Weekly schedule</span><button onclick="toggleSchedule()">&#10005;</button></div>' +
          (rows || '<div style="font-size:12px;color:var(--text-dim);">No classes added yet.</div>') +
          '<div style="border-top:1px solid var(--line-soft); padding-top:12px; display:flex; flex-direction:column; gap:8px;">' +
          '<select class="auth-input" id="newClassSubject">' + subjectOptions + '</select>' +
          '<div style="display:flex; gap:6px;">' +
          '<select class="auth-input" id="newClassDay" style="flex:1;">' + dayOptions + '</select>' +
          '<input class="auth-input" type="time" id="newClassStart" style="flex:1;"/>' +
          '<input class="auth-input" type="time" id="newClassEnd" style="flex:1;"/>' +
          '</div>' +
          '<button class="submit-btn" onclick="SCHEDULE.addClass()">Add to schedule</button>' +
          '</div>' +
          '<div style="border-top:1px solid var(--line-soft); padding-top:12px; display:flex; flex-direction:column; gap:8px;">' +
          '<span style="font-size:12px; color:var(--text-dim);">Or import from a photo of your timetable</span>' +
          '<input type="file" id="timetableFile" accept="image/*" onchange="SCHEDULE.uploadTimetable(this.files[0])"/>' +
          '<div id="importDraftMount"></div>' +
          '</div>' +
          '<div style="border-top:1px solid var(--line-soft); padding-top:12px;">' +
          '<div class="toggle-row">' +
          '<div class="toggle-text">' +
          '<span class="t">Push notifications</span>' +
          '<span class="d">Pings you 5 minutes before each class ends, and again 30 minutes after if you haven\'t marked it. Needs notification permission from your browser.</span>' +
          '</div>' +
          '<label class="switch">' +
          '<input type="checkbox" id="pushToggle" ' + (pushEnabled ? 'checked' : '') + ' onchange="PUSH.toggle(this.checked)"/>' +
          '<span class="switch-track"></span>' +
          '</label>' +
          '</div>' +
          '</div>' +
          '</div>';
      }

      function renderImportDraft() {
        var mount = document.getElementById('importDraftMount');
        if (!importDraft || !importDraft.length) { mount.innerHTML = '<div class="auth-msg error">No classes detected. Try a clearer photo.</div>'; return; }
        var rows = importDraft.map(function (r) {
          return '<div style="font-size:12px; color:var(--text-dim);">' + DAY_NAMES[r.day_of_week] + ' ' + r.start_time + '\u2013' + r.end_time + ' \u00b7 ' + r.subject_name + ' (' + r.type + ')</div>';
        }).join('');
        mount.innerHTML = rows + '<button class="submit-btn" onclick="SCHEDULE.confirmImport()">Looks good, add these</button>';
      }

      window.SCHEDULE = {
        addClass: async function () {
          var subjectId = document.getElementById('newClassSubject').value;
          var day = parseInt(document.getElementById('newClassDay').value, 10);
          var start = document.getElementById('newClassStart').value;
          var end = document.getElementById('newClassEnd').value;
          if (!subjectId || !start || !end) { showStatus('Fill in subject, start and end time.', true); return; }
          try {
            var res = await supabase.from('class_schedule').insert([{ subject_id: subjectId, day_of_week: day, start_time: start, end_time: end }]);
            if (res.error) throw res.error;
            await loadSchedule();
          } catch (e) {
            showStatus("Couldn't add class: " + e.message, true);
          }
        },
        removeClass: async function (id) {
          try {
            var res = await supabase.from('class_schedule').delete().eq('id', id);
            if (res.error) throw res.error;
            await loadSchedule();
          } catch (e) {
            showStatus("Couldn't remove class: " + e.message, true);
          }
        },
        cancelNext: async function (scheduleId) {
          var cls = schedule.find(function (c) { return c.id === scheduleId; });
          if (!cls) return;
          var today = new Date();
          var diff = (cls.day_of_week - today.getDay() + 7) % 7;
          var target = new Date(today);
          target.setDate(today.getDate() + diff);
          var dateStr = target.toISOString().slice(0, 10);
          try {
            var res = await supabase.from('class_log').upsert({
              schedule_id: cls.id, subject_id: cls.subject_id, class_date: dateStr,
              status: 'cancelled', resolved_at: new Date().toISOString()
            }, { onConflict: 'schedule_id,class_date' });
            if (res.error) throw res.error;
            showStatus('Marked ' + dateStr + ' as cancelled.', false);
          } catch (e) {
            showStatus("Couldn't mark cancelled: " + e.message, true);
          }
        },
        uploadTimetable: async function (file) {
          if (!file) return;
          var mount = document.getElementById('importDraftMount');
          mount.innerHTML = '<span class="spinner"></span> Reading timetable...';
          var reader = new FileReader();
          reader.onload = async function () {
            var base64 = reader.result.split(',')[1];
            try {
              var sessionRes = await supabase.auth.getSession();
              var token = sessionRes.data.session.access_token;
              var res = await fetch(SUPABASE_URL + '/functions/v1/parse-timetable', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ image_base64: base64, mime_type: file.type })
              });
              var data = await res.json();
              if (data.error) throw new Error(data.error);
              importDraft = data.classes;
              renderImportDraft();
            } catch (e) {
              mount.innerHTML = '<div class="auth-msg error">' + e.message + '</div>';
            }
          };
          reader.readAsDataURL(file);
        },
        confirmImport: async function () {
          if (!importDraft) return;
          var nameToId = {};
          subjects.forEach(function (s) { nameToId[s.name.toLowerCase()] = s.id; });
          var newSubjects = [];
          importDraft.forEach(function (row) {
            var key = row.subject_name.toLowerCase();
            if (!nameToId[key]) {
              newSubjects.push({ name: row.subject_name, type: row.type === 'lab' ? 'lab' : 'theory', min_attendance: 75, attended: 0, missed: 0 });
            }
          });
          try {
            if (newSubjects.length) {
              var insertRes = await supabase.from('subjects').insert(newSubjects).select();
              if (insertRes.error) throw insertRes.error;
              insertRes.data.forEach(function (s) { nameToId[s.name.toLowerCase()] = s.id; subjects.push(rowToLocal(s)); });
            }
            var toInsert = [];
            importDraft.forEach(function (row) {
              var subjectId = nameToId[row.subject_name.toLowerCase()];
              if (subjectId) {
                toInsert.push({ subject_id: subjectId, day_of_week: row.day_of_week, start_time: row.start_time, end_time: row.end_time });
              }
            });
            var res = await supabase.from('class_schedule').insert(toInsert);
            if (res.error) throw res.error;
            importDraft = null;
            document.getElementById('importDraftMount').innerHTML = '';
            render();
            await loadSchedule();
          } catch (e) {
            showStatus("Couldn't import timetable: " + e.message, true);
          }
        }
      };

      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var rawData = atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; i++) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
      }

      window.PUSH = {
        toggle: async function (checked) {
          var input = document.getElementById('pushToggle');
          if (checked) {
            var ok = await PUSH.enable();
            if (!ok && input) { input.checked = false; }
          } else {
            await PUSH.disable();
          }
          pushEnabled = checked && await PUSH.isActuallyEnabled();
          renderSchedule();
        },

        isActuallyEnabled: async function () {
          await refreshPushState();
          return pushEnabled;
        },

        enable: async function () {
          if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            showStatus('Push notifications are not supported on this browser or device.', true);
            return false;
          }
          try {
            var permission = await Notification.requestPermission();
            if (permission !== 'granted') {
              showStatus('Notification permission was not granted.', true);
              return false;
            }
            var reg = await navigator.serviceWorker.register('sw.js');
            var vapidKey = window.VAPID_PUBLIC_KEY || '';
            if (!vapidKey) { showStatus('Notifications are not configured yet.', true); return false; }
            var sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(vapidKey)
            });
            var json = sub.toJSON();
            var res = await supabase.from('push_tokens').upsert({
              endpoint: json.endpoint, p256dh: json.keys.p256dh, auth_key: json.keys.auth
            }, { onConflict: 'user_id,endpoint' });
            if (res.error) throw res.error;
            showStatus('Push notifications enabled.', false);
            return true;
          } catch (e) {
            showStatus("Couldn't enable notifications: " + e.message, true);
            return false;
          }
        },

        disable: async function () {
          try {
            if ('serviceWorker' in navigator) {
              var reg = await navigator.serviceWorker.getRegistration();
              if (reg) {
                var sub = await reg.pushManager.getSubscription();
                if (sub) {
                  var endpoint = sub.endpoint;
                  await sub.unsubscribe();
                  await supabase.from('push_tokens').delete().eq('endpoint', endpoint);
                }
              }
            }
            await supabase.from('push_tokens').delete().neq('id', '00000000-0000-0000-0000-000000000000');
            showStatus('Push notifications turned off.', false);
          } catch (e) {
            showStatus("Couldn't fully disable notifications: " + e.message, true);
          }
        }
      };

      async function checkConfirmParam() {
        var params = new URLSearchParams(window.location.search);
        var logId = params.get('confirm');
        if (!logId) return;
        try {
          var res = await supabase.from('class_log').select('*, subjects(name)').eq('id', logId).maybeSingle();
          if (res.error || !res.data) return;
          renderConfirmOverlay(res.data);
        } catch (e) { }
      }

      function renderConfirmOverlay(log) {
        var mount = document.getElementById('confirmOverlayMount');
        var name = log.subjects ? log.subjects.name : 'Class';
        mount.innerHTML =
          '<div class="panel-form" style="max-width:340px;">' +
          '<div class="panel-form-head"><span>' + name + '</span><button onclick="CONFIRM.dismiss()">&#10005;</button></div>' +
          '<div style="font-size:12px; color:var(--text-dim);">Did this class happen?</div>' +
          '<div style="display:flex; gap:8px;">' +
          '<button class="submit-btn" style="background:var(--safe);" onclick="CONFIRM.resolve(\'' + log.id + '\',\'' + log.subject_id + '\',\'present\')">Present</button>' +
          '<button class="submit-btn" style="background:var(--danger); color:#fff;" onclick="CONFIRM.resolve(\'' + log.id + '\',\'' + log.subject_id + '\',\'absent\')">Absent</button>' +
          '</div>' +
          '<button class="ghost-btn" onclick="CONFIRM.resolve(\'' + log.id + '\',\'' + log.subject_id + '\',\'cancelled\')">Class was officially cancelled</button>' +
          '</div>';
      }

      window.CONFIRM = {
        dismiss: function () {
          document.getElementById('confirmOverlayMount').innerHTML = '';
        },
        resolve: async function (logId, subjectId, status) {
          try {
            var res = await supabase.from('class_log').update({ status: status, resolved_at: new Date().toISOString() }).eq('id', logId);
            if (res.error) throw res.error;
            if (status === 'present' || status === 'absent') {
              var field = status === 'present' ? 'attended' : 'missed';
              var s = subjects.find(function (x) { return x.id === subjectId; });
              var newVal = (s ? s[field] : 0) + 1;
              var patch = {};
              patch[field] = newVal;
              var updateRes = await supabase.from('subjects').update(patch).eq('id', subjectId);
              if (updateRes.error) throw updateRes.error;
              if (s) { s[field] = newVal; render(); }
            }
            CONFIRM.dismiss();
            showStatus('Marked as ' + status + '.', false);
            var url = new URL(window.location.href);
            url.searchParams.delete('confirm');
            window.history.replaceState({}, '', url.toString());
          } catch (e) {
            showStatus("Couldn't save: " + e.message, true);
          }
        }
      };

      window.toggleAddForm = toggleAddForm;

      var topbarEl = document.getElementById('topbar');
      var ticking = false;
      window.addEventListener('scroll', function () {
        if (!ticking) {
          window.requestAnimationFrame(function () {
            if (window.scrollY > 8) topbarEl.classList.add('scrolled');
            else topbarEl.classList.remove('scrolled');
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });

      if (configured) {
        supabase.auth.onAuthStateChange(function (event, session) {
          if (event === 'PASSWORD_RECOVERY') {
            authMode = 'reset';
            document.getElementById('appShell').classList.add('hidden');
            document.getElementById('authShell').classList.remove('hidden');
            renderAuth();
          }
        });
      }

      checkExistingSession();
    })();
  </script>
</body>

</html>
